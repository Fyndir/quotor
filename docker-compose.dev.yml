# Environnement de développement : docker compose -f docker-compose.dev.yml up
#
# Les données vivent dans des volumes nommés, indépendants des conteneurs et du
# dossier du projet : `quotor_media` (clips, vignettes, montages, sources),
# `quotor_pgdata_dev` (base) et `quotor_backups` (sauvegardes, cf.
# /admin/sauvegardes). Ils survivent à `down`, `up --build` et à la recréation
# des conteneurs ; seul `docker compose down -v` (ou `docker volume rm …`) les
# efface.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "mix setup && mix phx.server"
    environment:
      DB_HOST: db
      MEDIA_DIR: /data/media
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - media:/data/media
      - backups:/data/backups
      - whisper_models:/data/models
      - deps:/app/deps
      - build:/app/_build
      - mix_home:/root/.mix
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Noms fixes : indépendants du nom du projet compose.
  pgdata_dev:
    name: quotor_pgdata_dev
  media:
    name: quotor_media
  backups:
    name: quotor_backups
  # modèles whisper.cpp, téléchargés au premier usage (~500 Mo pour « small »)
  whisper_models:
    name: quotor_whisper_models
  deps:
  build:
  mix_home:
