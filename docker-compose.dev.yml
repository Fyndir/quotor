# Environnement de développement : docker compose -f docker-compose.dev.yml up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "mix setup && mix phx.server"
    environment:
      DB_HOST: db
      MEDIA_DIR: /app/priv/media
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
      - mix_home:/root/.mix
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
  deps:
  build:
  mix_home:
